# Lets ComfyUI find models on a RunPod network volume, which is mounted at /runpod-volume.
# Models baked into the image under /comfyui/models are found as well.
runpod_volume:
  base_path: /runpod-volume/models
  diffusion_models: diffusion_models
  text_encoders: text_encoders
  vae: vae
  loras: loras
  checkpoints: checkpoints
  clip_vision: clip_vision
  upscale_models: upscale_models
